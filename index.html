<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FREE FIRE EVENT & UPDATE 🔥</title>
</head>
<body>

  <h1>FREE FIRE EVENT & UPDATE 🔥</h1>

  <div id="scanStatus">Sẵn sàng quét</div>
  <div id="progress">0%</div>

  <button id="scanBtn">BẮT ĐẦU QUÉT</button>

  <div id="results"></div>

  <script>
    const scanBtn = document.getElementById("scanBtn");
    const scanStatus = document.getElementById("scanStatus");
    const progress = document.getElementById("progress");
    const results = document.getElementById("results");

    let scanning = false;

    function renderProgress(value) {
      requestAnimationFrame(() => {
        progress.textContent = `${value}%`;
        scanStatus.textContent =
          value >= 100 ? "QUÉT HOÀN TẤT" : `ĐANG QUÉT ${value}%`;
      });
    }

    async function startScan() {
      if (scanning) return;

      scanning = true;
      scanBtn.disabled = true;
      results.innerHTML = "";
      renderProgress(1);

      try {
        const response = await fetch("/api/scan", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            timeout: 1200,
            concurrency: 100
          })
        });

        if (!response.ok) {
          throw new Error("API scan lỗi");
        }

        const data = await response.json();

        if (Array.isArray(data.results)) {
          results.innerHTML = data.results.map(item => `
            <div class="result">
              <b>${escapeHTML(item.url || "")}</b>
              <span>${escapeHTML(item.status || "")}</span>
            </div>
          `).join("");
        }

        renderProgress(100);

      } catch (error) {
        console.error(error);
        scanStatus.textContent = "LỖI KHI QUÉT";
      } finally {
        scanning = false;
        scanBtn.disabled = false;
      }
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    scanBtn.addEventListener("click", startScan);
  </script>

</body>
</html>
