<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>FAWAD Gaming - FF DATAMINER</title>

<meta name="description" content="Free Fire DataMiner scanner">
<meta name="theme-color" content="#050505">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:
        radial-gradient(circle at 50% -10%,rgba(255,40,40,.16),transparent 35%),
        linear-gradient(180deg,#080808,#020202 70%);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:1250px;
    margin:auto;
    padding:18px;
}

/* HEADER */

.header{
    border:1px solid rgba(255,255,255,.12);
    background:rgba(10,10,10,.88);
    box-shadow:
        0 0 35px rgba(255,0,0,.08),
        inset 0 1px 0 rgba(255,255,255,.03);
    border-radius:20px;
    padding:22px;
    margin-bottom:15px;
}

.logo{
    display:flex;
    align-items:center;
    gap:13px;
}

.logo-icon{
    width:48px;
    height:48px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e60000;
    box-shadow:0 0 25px rgba(255,0,0,.4);
    font-size:23px;
    font-weight:900;
}

.logo-text h1{
    font-size:23px;
    font-weight:900;
    letter-spacing:.4px;
}

.logo-text p{
    margin-top:4px;
    color:#8d8d8d;
    font-size:12px;
}

/* CONTROLS */

.controls{
    display:grid;
    grid-template-columns:1fr 180px;
    gap:10px;
    margin-top:20px;
}

.input,
.select{
    width:100%;
    height:48px;
    border:1px solid rgba(255,255,255,.12);
    background:#111;
    color:#fff;
    border-radius:13px;
    padding:0 15px;
    outline:none;
}

.input:focus,
.select:focus{
    border-color:#e60000;
    box-shadow:0 0 0 2px rgba(230,0,0,.1);
}

/* FILTER */

.filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:14px 0 3px;
    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter{
    flex:0 0 auto;
    border:1px solid rgba(255,255,255,.1);
    background:#101010;
    color:#aaa;
    padding:10px 15px;
    border-radius:999px;
    font-size:13px;
}

.filter.active{
    color:#fff;
    background:#e60000;
    border-color:#e60000;
    box-shadow:0 0 18px rgba(230,0,0,.25);
}

/* BUTTONS */

.actions{
    display:flex;
    gap:9px;
    margin-top:14px;
}

.btn{
    height:45px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.12);
    background:#151515;
    color:#fff;
    padding:0 18px;
    font-weight:800;
}

.btn.primary{
    background:#e60000;
    border-color:#e60000;
    box-shadow:0 0 20px rgba(230,0,0,.2);
}

.btn.stop{
    background:#fff;
    color:#000;
    display:none;
}

/* STATUS */

.status-box{
    margin-top:15px;
    padding:14px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.08);
    background:#0d0d0d;
}

.status-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
}

.status-text{
    font-size:13px;
    color:#aaa;
}

.status-count{
    color:#fff;
    font-weight:900;
}

/* SCAN ANIMATION */

.scan-animation-container{
    display:none;
    width:100%;
    height:30px;
    position:relative;
    align-items:center;
    justify-content:center;
    margin-top:6px;
}

.bouncing-ball{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#e60000;
    box-shadow:
        0 0 8px #e60000,
        0 0 18px rgba(230,0,0,.7);
    animation:bounceTrack .6s linear infinite alternate;
}

@keyframes bounceTrack{
    from{
        transform:translateX(-70px);
    }
    to{
        transform:translateX(70px);
    }
}

/* PROGRESS */

.progress-bar{
    width:100%;
    height:4px;
    margin-top:5px;
    background:#252525;
    border-radius:99px;
    overflow:hidden;
    display:none;
}

.progress-fill{
    width:0%;
    height:100%;
    background:#e60000;
    box-shadow:
        0 0 10px #e60000,
        0 0 20px rgba(230,0,0,.6);
    transition:none;
}

/* GRID */

.results{
    margin-top:17px;
}

.results-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.results-head h2{
    font-size:17px;
}

.results-head span{
    color:#777;
    font-size:12px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

/* CARD */

.card{
    position:relative;
    overflow:hidden;
    background:#0c0c0c;
    border:1px solid rgba(255,255,255,.09);
    border-radius:15px;
    min-width:0;
    animation:cardIn .18s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.card-image{
    display:block;
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    background:#151515;
}

.card-body{
    padding:10px;
}

.card-name{
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card-url{
    margin-top:5px;
    color:#666;
    font-size:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card-copy{
    width:100%;
    margin-top:9px;
    height:32px;
    border:1px solid rgba(255,255,255,.1);
    background:#161616;
    color:#fff;
    border-radius:8px;
    font-size:11px;
    font-weight:700;
}

.card-copy:active{
    transform:scale(.98);
}

/* EMPTY */

.empty{
    border:1px dashed rgba(255,255,255,.1);
    border-radius:16px;
    padding:40px 20px;
    text-align:center;
    color:#666;
    grid-column:1/-1;
}

.empty strong{
    display:block;
    color:#aaa;
    margin-bottom:5px;
}

/* FOOTER */

.footer{
    padding:25px 0 10px;
    text-align:center;
    color:#444;
    font-size:11px;
}

/* MOBILE */

@media(max-width:900px){
    .grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:650px){
    .app{
        padding:10px;
    }

    .header{
        padding:16px;
        border-radius:16px;
    }

    .controls{
        grid-template-columns:1fr;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:8px;
    }

    .logo-text h1{
        font-size:19px;
    }
}

@media(max-width:380px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="app">

    <section class="header">

        <div class="logo">
            <div class="logo-icon">FF</div>

            <div class="logo-text">
                <h1>FAWAD Gaming</h1>
                <p>FREE FIRE DATA MINER</p>
            </div>
        </div>

        <div class="controls">

            <input
                id="searchInput"
                class="input"
                type="text"
                placeholder="Search asset..."
                autocomplete="off"
            >

            <select id="regionSelect" class="select">
                <option value="IND">IND</option>
                <option value="BD">BD</option>
                <option value="SG">SG</option>
                <option value="PK">PK</option>
                <option value="EU">EU</option>
                <option value="NA">NA</option>
            </select>

        </div>

        <div class="filters">

            <button class="filter active" data-group="ALL">
                ALL
            </button>

            <button class="filter" data-group="TW">
                TW
            </button>

            <button class="filter" data-group="DW">
                DW
            </button>

            <button class="filter" data-group="FW">
                FW
            </button>

            <button class="filter" data-group="MOCO">
                MOCO
            </button>

            <button class="filter" data-group="TT">
                TT
            </button>

            <button class="filter" data-group="ROYALE">
                ROYALE
            </button>

            <button class="filter" data-group="TOPUP">
                TOPUP
            </button>

            <button class="filter" data-group="STORE">
                STORE
            </button>

        </div>

        <div class="actions">

            <button
                id="scanBtn"
                class="btn primary"
                type="button">
                START SCAN
            </button>

            <button
                id="cancelBtn"
                class="btn stop"
                type="button">
                STOP
            </button>

        </div>

        <div class="status-box">

            <div class="status-row">

                <div
                    id="statusTxt"
                    class="status-text">
                    Ready to scan
                </div>

                <div
                    id="foundCount"
                    class="status-count">
                    0
                </div>

            </div>

            <div
                id="scanAnim"
                class="scan-animation-container">

                <div class="bouncing-ball"></div>

            </div>

            <div
                id="pBar"
                class="progress-bar">

                <div
                    id="pFill"
                    class="progress-fill">
                </div>

            </div>

        </div>

    </section>


    <section class="results">

        <div class="results-head">

            <h2>SCAN RESULTS</h2>

            <span id="resultInfo">
                0 assets
            </span>

        </div>

        <div
            id="resultsGrid"
            class="grid">

            <div class="empty">

                <strong>No assets found</strong>

                Start a scan to search Free Fire assets.

            </div>

        </div>

    </section>


    <div class="footer">
        FAWAD Gaming • FF DATAMINER
    </div>

</div>


<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const API_SCAN = "/api/scan";

const regions = [
    "IND",
    "BD",
    "SG",
    "PK",
    "EU",
    "NA"
];

const suffixes = [
    "en.jpg",
    "en.png",
    "ru.jpg"
];

const configPath =
    "/common/Local/IND/config/";

const splashPath =
    "/common/Local/BD/Splashanno/";

const dateCodes = [
    "26S16",
    "26S17",
    "26S18",
    "26S19",
    "26S20",
    "26S21",
    "26S22",
    "26S23",
    "26S24",
    "26S25",
    "26S26",
    "26S27",
    "26S28",
    "26S29",
    "26S30",
    "26S31"
];

const eventGroups = {

    ALL: [
        "TW1",
        "TW2",
        "TW3",
        "TW4",
        "TW5",
        "TW6",
        "DW1",
        "DW2",
        "DW3",
        "DW4",
        "WV1",
        "FW1",
        "FW2",
        "FW3",
        "FW4",
        "MocoStore",
        "MocoStore1",
        "MocoStore2",
        "MocoStore3",
        "TT1",
        "TT2",
        "OT1",
        "OT2",
        "OT3"
    ],

    TW: [
        "TW1",
        "TW2",
        "TW3",
        "TW4",
        "TW5",
        "TW6"
    ],

    DW: [
        "DW1",
        "DW2",
        "DW3",
        "DW4",
        "WV1"
    ],

    FW: [
        "FW1",
        "FW2",
        "FW3",
        "FW4"
    ],

    MOCO: [
        "MocoStore",
        "MocoStore1",
        "MocoStore2",
        "MocoStore3"
    ],

    TT: [
        "TT1",
        "TT2"
    ],

    ROYALE: [
        "OT1",
        "OT2",
        "OT3"
    ],

    TOPUP: [],

    STORE: []
};


/* =========================================================
   STATE
========================================================= */

let globalScanId = 0;

let foundAssets = new Set();

let totalItems = 0;

let processedItems = 0;

let currentGroup = "ALL";

let currentQueue = [];

let currentResults = [];

let visualFrame = null;


/* =========================================================
   DOM
========================================================= */

const scanBtn =
    document.getElementById("scanBtn");

const cancelBtn =
    document.getElementById("cancelBtn");

const statusTxt =
    document.getElementById("statusTxt");

const foundCount =
    document.getElementById("foundCount");

const resultInfo =
    document.getElementById("resultInfo");

const pBar =
    document.getElementById("pBar");

const pFill =
    document.getElementById("pFill");

const scanAnim =
    document.getElementById("scanAnim");

const resultsGrid =
    document.getElementById("resultsGrid");

const searchInput =
    document.getElementById("searchInput");

const regionSelect =
    document.getElementById("regionSelect");


/* =========================================================
   FILTER
========================================================= */

document
.querySelectorAll(".filter")
.forEach(button => {

    button.addEventListener("click", () => {

        document
        .querySelectorAll(".filter")
        .forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        currentGroup =
            button.dataset.group;

        clearResults();
    });

});


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    filterCards
);


function filterCards(){

    const keyword =
        searchInput.value
        .trim()
        .toLowerCase();

    const cards =
        document.querySelectorAll(
            ".card"
        );

    cards.forEach(card => {

        const text =
            card.innerText
            .toLowerCase();

        card.style.display =
            !keyword ||
            text.includes(keyword)
                ? ""
                : "none";

    });

}


/* =========================================================
   BUILD SCAN QUEUE
========================================================= */

function buildScanQueue(){

    const region =
        regionSelect.value;

    const groupItems =
        eventGroups[currentGroup] || [];

    const queue = [];

    /*
       Các mẫu đường dẫn được tạo ở đây.
       API sẽ nhận URL thật và kiểm tra.
    */

    for(const eventName of groupItems){

        for(const date of dateCodes){

            for(const suffix of suffixes){

                const filename =
                    `${eventName}_${date}_${suffix}`;

                const url =
                    `https://dl.dir.freefiremobile.com` +
                    `/common/Local/${region}` +
                    `/config/${filename}`;

                queue.push({
                    url,
                    fname:filename,
                    region,
                    type:eventName
                });

            }

        }

    }

    /*
       Splash assets
    */

    for(const date of dateCodes){

        for(const suffix of suffixes){

            const filename =
                `Splash_${date}_${suffix}`;

            const url =
                `https://dl.dir.freefiremobile.com` +
                `/common/Local/${region}` +
                `/Splashanno/${filename}`;

            queue.push({
                url,
                fname:filename,
                region,
                type:"SPLASH"
            });

        }

    }

    /*
       Remove duplicate URLs
    */

    const seen =
        new Set();

    return queue.filter(item => {

        if(seen.has(item.url)){
            return false;
        }

        seen.add(item.url);

        return true;

    });

}


/* =========================================================
   FAST VISUAL PROGRESS
========================================================= */

function startVisualProgress(scanId){

    cancelAnimationFrame(
        visualFrame
    );

    const started =
        performance.now();

    function frame(now){

        if(scanId !== globalScanId){
            return;
        }

        const percent =
            Math.min(
                100,
                ((now - started) / 200) * 100
            );

        pFill.style.width =
            `${percent}%`;

        statusTxt.innerText =
            `Scanning... ${Math.floor(percent)}%`;

        if(percent < 100){

            visualFrame =
                requestAnimationFrame(frame);

        }else{

            pFill.style.width =
                "100%";

            statusTxt.innerText =
                "Scanning... 100%";

        }

    }

    visualFrame =
        requestAnimationFrame(frame);
}


/* =========================================================
   API SCAN
========================================================= */

async function scanByAPI(
    queue,
    scanId
){

    const urls =
        queue.map(item => item.url);

    const response =
        await fetch(
            API_SCAN,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({
                    urls
                })
            }
        );

    if(scanId !== globalScanId){
        return null;
    }

    if(!response.ok){

        let message =
            "SCAN API ERROR";

        try{

            const error =
                await response.json();

            if(error.message){
                message =
                    error.message;
            }

        }catch{}

        throw new Error(message);
    }

    return await response.json();
}


/* =========================================================
   START ENGINE
========================================================= */

async function startEngine(){

    globalScanId++;

    const myScanId =
        globalScanId;

    foundAssets.clear();

    currentResults = [];

    clearResults();

    processedItems = 0;

    totalItems = 0;

    scanBtn.disabled = true;

    cancelBtn.style.display =
        "block";

    pBar.style.display =
        "block";

    scanAnim.style.display =
        "flex";

    pFill.style.width =
        "0%";

    statusTxt.innerText =
        "Preparing scan...";

    foundCount.innerText =
        "0";

    /*
       Create queue
    */

    const queue =
        buildScanQueue();

    currentQueue =
        queue;

    totalItems =
        queue.length;

    resultInfo.innerText =
        `${totalItems} paths`;

    if(!totalItems){

        finishScan(
            myScanId,
            "No scan paths"
        );

        return;
    }

    /*
       Visual progress is intentionally
       separated from real network scanning.
    */

    startVisualProgress(
        myScanId
    );

    /*
       Real API scan
    */

    try{

        const data =
            await scanByAPI(
                queue,
                myScanId
            );

        if(
            myScanId !==
            globalScanId
        ){
            return;
        }

        if(!data){
            return;
        }

        /*
           Process actual results
        */

        const found =
            Array.isArray(data.results)
                ? data.results
                : [];

        currentResults =
            found;

        for(const result of found){

            if(
                myScanId !==
                globalScanId
            ){
                return;
            }

            const original =
                queue.find(
                    item =>
                        item.url ===
                        result.url
                );

            if(
                !original ||
                foundAssets.has(
                    original.fname
                )
            ){
                continue;
            }

            foundAssets.add(
                original.fname
            );

            createCard(
                original
            );

        }

        processedItems =
            totalItems;

        foundCount.innerText =
            foundAssets.size;

        resultInfo.innerText =
            `${foundAssets.size} assets found`;

        finishScan(
            myScanId
        );

    }catch(error){

        if(
            myScanId !==
            globalScanId
        ){
            return;
        }

        console.error(
            "SCAN ERROR:",
            error
        );

        cancelAnimationFrame(
            visualFrame
        );

        pFill.style.width =
            "100%";

        statusTxt.innerText =
            "Scan API Error";

        scanAnim.style.display =
            "none";

        cancelBtn.style.display =
            "none";

        scanBtn.disabled =
            false;

    }

}


/* =========================================================
   FINISH
========================================================= */

function finishScan(
    scanId,
    customMessage
){

    if(scanId !== globalScanId){
        return;
    }

    cancelAnimationFrame(
        visualFrame
    );

    pFill.style.width =
        "100%";

    const count =
        foundAssets.size;

    if(customMessage){

        statusTxt.innerText =
            customMessage;

    }else{

        statusTxt.innerHTML =
            `<span style="color:#fff;font-weight:800;">
                Scan Complete
            </span>
            &nbsp;•&nbsp;
            ${count} found`;

    }

    foundCount.innerText =
        count;

    scanAnim.style.display =
        "none";

    pBar.style.display =
        "none";

    cancelBtn.style.display =
        "none";

    scanBtn.disabled =
        false;

}


/* =========================================================
   STOP
========================================================= */

function stopScan(){

    globalScanId++;

    cancelAnimationFrame(
        visualFrame
    );

    scanAnim.style.display =
        "none";

    pBar.style.display =
        "none";

    cancelBtn.style.display =
        "none";

    scanBtn.disabled =
        false;

    statusTxt.innerText =
        "Scan stopped";

}


/* =========================================================
   CLEAR
========================================================= */

function clearResults(){

    foundAssets.clear();

    currentResults = [];

    resultsGrid.innerHTML =
        `
        <div class="empty">
            <strong>No assets found</strong>
            Start a scan to search Free Fire assets.
        </div>
        `;

    foundCount.innerText =
        "0";

    resultInfo.innerText =
        "0 assets";

}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(item){

    const card =
        document.createElement(
            "article"
        );

    card.className =
        "card";

    card.dataset.name =
        item.fname;

    card.innerHTML = `
        <img
            class="card-image"
            src="${escapeAttribute(item.url)}"
            alt="${escapeAttribute(item.fname)}"
            loading="lazy"
            referrerpolicy="no-referrer"
        >

        <div class="card-body">

            <div class="card-name">
                ${escapeHTML(item.fname)}
            </div>

            <div class="card-url">
                ${escapeHTML(item.url)}
            </div>

            <button
                class="card-copy"
                type="button">
                COPY URL
            </button>

        </div>
    `;

    const copyButton =
        card.querySelector(
            ".card-copy"
        );

    copyButton.addEventListener(
        "click",
        async () => {

            try{

                await navigator.clipboard.writeText(
                    item.url
                );

                copyButton.innerText =
                    "COPIED";

                setTimeout(() => {

                    copyButton.innerText =
                        "COPY URL";

                },1000);

            }catch{

                copyButton.innerText =
                    "COPY FAILED";

            }

        }
    );

    /*
       Replace empty state
    */

    const empty =
        resultsGrid.querySelector(
            ".empty"
        );

    if(empty){
        empty.remove();
    }

    resultsGrid.appendChild(
        card
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

function escapeAttribute(value){

    return escapeHTML(value);

}


/* =========================================================
   EVENTS
========================================================= */

scanBtn.addEventListener(
    "click",
    startEngine
);

cancelBtn.addEventListener(
    "click",
    stopScan
);


/* =========================================================
   KEYBOARD
========================================================= */

searchInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            event.preventDefault();

            startEngine();

        }

    }
);


/* =========================================================
   INIT
========================================================= */

regionSelect.value =
    localStorage.getItem(
        "ff_scan_region"
    ) || "IND";

regionSelect.addEventListener(
    "change",
    () => {

        localStorage.setItem(
            "ff_scan_region",
            regionSelect.value
        );

    }
);

</script>
